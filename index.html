<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    <header>
        <h1>Solar System Explorer</h1>
        <p>Explore the wonders of our cosmic neighborhood</p>
    </header>
    
    <main>
        <section class="solar-system">
            <div class="sun" title="Sun">
                <span class="planet-name">Sun</span>
            </div>
            
            <div class="orbit mercury-orbit">
                <div class="planet mercury" title="Mercury">
                    <span class="planet-name">Mercury</span>
                </div>
            </div>
            
            <div class="orbit venus-orbit">
                <div class="planet venus" title="Venus">
                    <span class="planet-name">Venus</span>
                </div>
            </div>
            
            <div class="orbit earth-orbit">
                <div class="planet earth" title="Earth">
                    <span class="planet-name">Earth</span>
                </div>
            </div>
            
            <div class="orbit mars-orbit">
                <div class="planet mars" title="Mars">
                    <span class="planet-name">Mars</span>
                </div>
            </div>
            
            <div class="orbit jupiter-orbit">
                <div class="planet jupiter" title="Jupiter">
                    <span class="planet-name">Jupiter</span>
                </div>
            </div>
            
            <div class="orbit saturn-orbit">
                <div class="planet saturn" title="Saturn">
                    <span class="planet-name">Saturn</span>
                    <div class="ring"></div>
                </div>
            </div>
            
            <div class="orbit uranus-orbit">
                <div class="planet uranus" title="Uranus">
                    <span class="planet-name">Uranus</span>
                </div>
            </div>
            
            <div class="orbit neptune-orbit">
                <div class="planet neptune" title="Neptune">
                    <span class="planet-name">Neptune</span>
                </div>
            </div>
        </section>
        
        <section class="info-panel">
            <h2>Planet Information</h2>
            <div id="planet-info">
                <p>Hover over or click a planet to learn more about it!</p>
            </div>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
